[env:rescue_node_c6]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_level = extra

build_flags = 
  ${esp32c6_base.build_flags}
  -D PRIVATE_HW
  -I variants/esp32c6/diy/rescue_node_c6
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ; Pre-set default region to India 865-867 MHz so both nodes connect immediately out of the box
  -D USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_IN
  ; Disable screen & audio to save flash on 4MB C6
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1

lib_ignore =
  ${esp32c6_base.lib_ignore}
  ESP32 Codec2
