name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p apk_output
          cp android/app/build/outputs/apk/debug/app-debug.apk apk_output/Lorax-SAR-Tactical-Command.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lorax-SAR-Tactical-Command-APK
          path: apk_output/Lorax-SAR-Tactical-Command.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "Lorax SAR Tactical Command - Android APK (Latest)"
          body: |
            ### 📱 Lorax SAR Tactical Command Android APK
            - **Platform:** Android 8.0+ (API 26+)
            - **Features:** Native Bluetooth Low Energy (BLE), Location/GPS support, Offline Maps, and Meshtastic Mesh Telemetry.
            - **Target:** Seeed Studio XIAO ESP32-C6 / Meshtastic SX1262 LoRa Nodes.
            
            Download `Lorax-SAR-Tactical-Command.apk` below and install directly on your Android device.
          files: apk_output/Lorax-SAR-Tactical-Command.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
